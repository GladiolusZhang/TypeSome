name: Build word-pair data

# Next-word statistics take a while to compute from the corpora, so they are built on demand
# and kept on the "data" branch; the APK build just copies them.
on:
  workflow_dispatch:

jobs:
  ngram:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Generate pinyin dictionary (rime-ice)
        run: python tools/gen_dict.py
      - name: Count word pairs
        env:
          NGRAM_LINES: "8000000"
        run: |
          mkdir -p data
          python tools/gen_ngram.py app/src/main/assets/pinyin_dict.txt data/zh_bigram.txt app/src/main/assets/en_words.txt data/en_bigram.txt 2>&1 | tee data/ngram-log.txt
      - name: Publish to the "data" branch
        run: |
          cd data
          git init -q -b data
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Word-pair data for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" data
