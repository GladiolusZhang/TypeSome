name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate pinyin dictionary (rime-ice)
        run: python tools/gen_dict.py

      - uses: gradle/actions/setup-gradle@v5

      - name: Build
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            # Surface the compiler errors as an annotation so they are readable without downloading logs.
            msg=$(grep -E "^e: |error:|What went wrong|Could not|^> " build.log | grep -v "^> Task" | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle build failed::$msg"
          fi
          exit $status

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/VoiceIME-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceIME-apk
          path: out/*.apk

      - name: Publish as a release (main branch only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 声键输入法 build ${{ github.run_number }}
          files: out/*.apk
          prerelease: true
