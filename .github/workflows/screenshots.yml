name: Screenshots

on:
  workflow_run:
    workflows: ["Build APK"]
    types: [completed]
  workflow_dispatch:

jobs:
  shots:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: TypeSome-apk
          path: apk
          run-id: ${{ github.event.workflow_run.id || '' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - run: pip install pillow

      - uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: true
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          script: |
            adb wait-for-device; sleep 15
            adb install -r -g $(ls apk/*.apk | head -1) || (sleep 10; adb install -r -g $(ls apk/*.apk | head -1))
            adb shell ime enable com.shuyu.voiceime/.ImeService
            adb shell ime set com.shuyu.voiceime/.ImeService
            adb shell settings put secure show_ime_with_hard_keyboard 1
            python3 tools/screens.py shots > screens-log.txt 2>&1 || echo "screens.py failed" >> screens-log.txt

      - name: Publish screenshots to the "screenshots" branch
        if: always()
        run: |
          mkdir -p shots
          cp screens-log.txt shots/ 2>/dev/null || echo "no log (emulator step failed early)" > shots/screens-log.txt
          cd shots
          git init -q -b screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots for ${{ github.event.workflow_run.head_sha || github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" screenshots
